<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"> <title>智域駭客：源碼傳說</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="game-viewport">
        <div class="top-stats">
            <div class="stat-box">LV. <span id="val-lv">1</span></div>
            <div class="stat-box">戰力: <span id="val-power">100</span></div>
            <div class="stat-box">🪙 <span id="val-gold">0</span></div>
        </div>

        <div class="combat-area">
            <div class="characters">
                <div class="player-character">
                    <div class="avatar">HACKER</div>
                    <div class="health-bar"></div>
                </div>
                <div class="vs-label">VS</div>
                <div class="enemy-character">
                    <div class="avatar">FIREWALL</div>
                    <div class="health-bar"></div>
                </div>
            </div>            
        </div>

        <div class="equipment-panel">
            <div class="equip-col">
                <div class="slot" data-type="weapon">Lv.0</div>
                <div class="slot" data-type="head">Lv.0</div>
                <div class="slot" data-type="chest">Lv.0</div>
            </div>
            <div class="equip-col">
                <div class="slot" data-type="legs">Lv.0</div>
                <div class="slot" data-type="feet">Lv.0</div>
                <div class="slot" data-type="accessory">Lv.0</div>
            </div>
        </div>

        <div class="terminal-footer">
            <div class="energy-display">⚡ 算力: <span id="val-energy">50</span></div>
            
            <div class="unbox-wrapper">
                <button id="unbox-btn" onclick="triggerUnbox()">
                    <span class="btn-main">解碼</span>
                    <span class="btn-sub">消耗 1 算力</span>
                </button>
                <button id="btn-terminal-level" class="level-btn-corner" onclick="openUpgradeModal()">Lv.1</button>
            </div>
        </div>

        <div id="upgrade-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">解碼器升級 (Lv.<span id="upg-current-lv">1</span> ➡️ Lv.<span id="upg-next-lv">2</span>)</div>
                
                <div class="rates-comparison">
                    <div class="rate-col">
                        <h4>當前獲得機率</h4>
                        <div id="rate-current-list"></div>
                    </div>
                    <div class="rate-col">
                        <h4>下一級機率</h4>
                        <div id="rate-next-list"></div>
                    </div>
                </div>

                <div class="upgrade-progress">
                    <div class="progress-text">充能進度: <span id="upg-exp-text">0 / 5</span></div>
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" id="upg-bar-fill" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="modal-buttons">
                    <button id="btn-buy-exp" class="btn-primary" onclick="buyTerminalExp()">充能 (🪙 <span id="upg-cost">100</span>)</button>
                    <button class="btn-secondary" onclick="closeUpgradeModal()">關閉</button>
                </div>
            </div>
        </div>

        <div class="chat-bar">
            <span>[世界] 系統：歡迎來到智域駭客，開始解碼吧！</span>
        </div>

        <div class="bottom-nav">
            <div class="nav-item active">角色</div>
            <div class="nav-item">同伴</div>
            <div class="nav-item">副本</div>
            <div class="nav-item">家園</div>
            <div class="nav-item">家族</div>
            <div class="nav-item">商店</div>
        </div>

        <div id="toast-container"></div>

        <div id="compare-modal" class="modal-overlay" style="display: none;">
            <div class="modal-content">
                <div class="modal-header">數據模組比對</div>
                
                <div class="compare-box old-equip">
                    <div class="equip-label">當前裝備 <span id="modal-type"></span></div>
                    <div class="equip-name" id="modal-old-name">無</div>
                    <div class="equip-power" id="modal-old-power">Power +0</div>
                </div>

                <div class="compare-arrow">
                    ➡️ 戰力差異: <span id="modal-diff">0</span>
                </div>

                <div class="compare-box new-equip">
                    <div class="equip-label">新解析模組</div>
                    <div class="equip-name" id="modal-new-name">無</div>
                    <div class="equip-power" id="modal-new-power">Power +0</div>
                </div>

                <div class="modal-buttons">
                    <button id="btn-equip" class="btn-primary" onclick="confirmEquip()">裝備</button>
                    <button id="btn-recycle" class="btn-secondary" onclick="confirmRecycle()">回收 (🪙 +<span id="modal-recycle-val">0</span>)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
